name: Vehicle service app tests

on:
  push:
    paths:
      - "vehicle_service_review3/**"
      - ".github/workflows/vehicle-service-tests.yml"
  pull_request:
    paths:
      - "vehicle_service_review3/**"
      - ".github/workflows/vehicle-service-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r vehicle_service_review3/requirements.txt
      - name: Run regression tests
        working-directory: vehicle_service_review3
        run: python -m unittest discover -s tests -v
